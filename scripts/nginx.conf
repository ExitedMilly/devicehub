user  nginx;
worker_processes  1;

error_log   /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {

  # Per-serial capture-mgr routing — generated by scripts/generate.py.
  # See scripts/generated/devicehub-instances.conf for the map block.
  # One-time host setup: add to devicehub-nginx volumes in docker-compose-prod.yaml:
  #   - ./scripts/generated/devicehub-instances.conf:/etc/nginx/conf.d/devicehub-instances.conf:ro
  include /etc/nginx/conf.d/devicehub-instances.conf;

  server {
    listen 80;
    listen 443 ssl;
    server_name nginx;

    # Certificates (default are generated by omgwtfssl)
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_session_timeout 5m;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers 'ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-DSS-AES128-GCM-SHA256:kEDH+AESGCM:ECDHE-RSA-AES128-SHA256:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA:ECDHE-ECDSA-AES128-SHA:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA:ECDHE-ECDSA-AES256-SHA:DHE-RSA-AES128-SHA256:DHE-RSA-AES128-SHA:DHE-DSS-AES128-SHA256:DHE-RSA-AES256-SHA256:DHE-DSS-AES256-SHA:DHE-RSA-AES256-SHA:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA256:AES256-SHA256:AES128-SHA:AES256-SHA:AES:CAMELLIA:DES-CBC3-SHA:!aNULL:!eNULL:!EXPORT:!DES:!RC4:!MD5:!PSK:!aECDH:!EDH-DSS-DES-CBC3-SHA:!EDH-RSA-DES-CBC3-SHA:!KRB5-DES-CBC3-SHA';
    ssl_prefer_server_ciphers on;


    client_max_body_size 1024M;

    resolver 127.0.0.11 valid=10s;

    location = /auth {
      # Variable upstream forces per-request DNS re-resolution via resolver,
      # so nginx never pins a dead app IP after the app container is recreated.
      set $app_upstream devicehub-app;
      proxy_pass http://$app_upstream:3000;
    }

    # Use this if you have provider is in the docker network.
    # WARNING: This allows direct access to any host in the network. Use with caution.
    location ~ ^/d/(?<stfprovider>[^/]+)/(?<port>[0-9]+)/$ {
        proxy_pass http://$stfprovider:$port/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /auth/ {
      proxy_pass http://devicehub-auth:3000;
    }

    location /api/ {
      proxy_pass http://devicehub-api:3000;
    }

    location /s/image/ {
      proxy_pass http://devicehub-storage-plugin-image:3000;
    }

    location /s/apk/ {
      proxy_pass http://devicehub-storage-plugin-apk:3000;
    }

    location /s/ {
      client_max_body_size 2048m;
      client_body_buffer_size 128k;
      proxy_pass http://devicehub-storage-temp:3000;
    }

    location /socket.io/ {
      proxy_pass http://devicehub-websocket:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection upgrade;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $http_x_real_ip;
    }

    location /audio/ {
      proxy_pass http://$capture_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /mic-rtc/ {
      proxy_pass http://$capture_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /mic-state/ {
      proxy_pass http://$capture_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /camera/ {
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_pass http://$capture_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /camera-state/ {
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_pass http://$capture_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /manager-api/ {
      rewrite ^/manager-api/(.*)$ /api/$1 break;
      proxy_pass http://$capture_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /file-video/ {
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_pass http://$capture_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /file-audio/ {
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_pass http://$capture_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
      # Variable upstream forces per-request DNS re-resolution via resolver,
      # so nginx never pins a dead app IP after the app container is recreated.
      set $app_upstream devicehub-app;
      proxy_pass http://$app_upstream:3000;
    }
  }
}
