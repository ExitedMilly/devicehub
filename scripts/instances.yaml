# instances.yaml — committed to git, describes topology of N instances.
# Host-specific paths and overrides go to instances.local.env.

defaults:
  pulse_volume: devicehub_pulse-sock      # Docker volume name
  docker_network: devicehub_devicehub     # Docker network name
  capture_image: audio-capture-mgr        # locally-built image
  # Operator-identity image: budtmo base + modem-operator shim
  # (docker/emulator-operator/). Behaves exactly like stock budtmo when no
  # OP_* env is set; up-scripts build it if missing.
  emulator_image: orchid-emulator:op
  emulator_device: "Samsung Galaxy S10"

# Optional per-instance operator identity (MCC/MNC + name). Omit to keep the
# emulator's stock operator (T-Mobile 310-260). Example:
#   - name: mts1
#     ...
#     op_mcc: "250"          # MCC
#     op_mnc: "01"           # MNC (length matters: "01" = 2-digit, "001" = 3-digit)
#     op_name: MTS           # network operator long name
#     op_name_short: MTS     # optional; defaults to op_name
#     op_roaming: false      # reserved no-op (roaming needs modem_simulator binary patch)

# Optional per-instance Wi-Fi AP via netsim (needs emulator 36.6 -> the
# orchid-emulator:op-v2 image, which carries the shlex transport fix). Omit for
# the stock open network (AndroidWifi). Password optional; if set, 8+ chars =>
# WPA2/CCMP. Example:
#   - name: wifi1
#     ...
#     emulator_image: orchid-emulator:op-v2
#     wifi_ssid: OrchidNet
#     wifi_password: "orchidpass"

# Optional per-instance phone number (digits only, no leading +). When set, the
# manager applies it via the emulator console after boot. Omit to keep default.
#   - name: phone1
#     ...
#     phone_number: "79001234567"

# Optional per-instance device identity:
#   serialno — sets ro.serialno at launch via bootconfig
#     (-append-userspace-opt androidboot.serialno=...). Chars [A-Za-z0-9._-].
#     (The emulator's own -android-serialno flag is broken on this 36.6 build —
#     its validator regex aborts qemu — so we use the bootconfig path.)
#   wifi_mac — sets wlan0's MAC, applied by the manager's wifi-autoconnect after
#     boot (ip link + join with -r none). Needs wifi_ssid. Example:
#   initial_lat / initial_lon — INITIAL GPS location applied by the manager after
#     boot (GPS mock keepalive), so a fresh device shows this instead of the
#     emulator's Googleplex default (37.422,-122.084). Both must be set together
#     (lat -90..90, lon -180..180). Starting value only — the user can override it
#     from the UI (their apply replaces it). Omit both => emulator default (no-op).
#   - name: id1
#     ...
#     serialno: "MYSERIAL123"
#     wifi_mac: "02:00:17:00:00:01"
#     initial_lat: 55.751244
#     initial_lon: 37.618423

# Optional per-instance BT signal strength (RSSI in dBm) via netsim, applied at
# launch (needs the op-v2 / 36.6 image). Value is an i8 (-128..127). A bare
# number defaults to the BLE PhyKind; prefix with ble:/bt_classic: to be explicit.
# Combines with wifi_ssid into a single -netsim-args value. Example:
#   - name: bt1
#     ...
#     emulator_image: orchid-emulator:op-v2
#     bt_rssi: "-65"          # => --rssi ble:-65   (or "bt_classic:-70")

# Optional per-instance fake BLE beacons (custom Bluetooth devices the emulator
# sees in its BLE scan). netsim's --config file cannot define custom beacons, so
# these are injected after boot via netsimd's frontend API (POST /v1/devices).
# Needs the op-v2 image. Each item: name (required) plus optional
# mac / manufacturer_data (hex) / service_uuid / service_data (hex) /
# tx_power (ultra-low|low|medium|high | <dbm>) / interval
# (low-power|balanced|low-latency | <ms>) / include_device_name / scannable.
# Empty or omitted => no beacons (no-op). Example:
#   - name: beacon1
#     ...
#     emulator_image: orchid-emulator:op-v2
#     ble_beacons:
#       - name: OrchidBeacon
#         mac: "be:ac:0b:0c:0d:0e"
#         manufacturer_data: "00ff01020304"
#         service_uuid: "0000fe2c-0000-1000-8000-00805f9b34fb"
#         tx_power: high
#         interval: low-latency

# Optional per-instance API docs gate. The manager serves a reference Swagger UI page at
# /api/docs and the raw document at /api/openapi.json; both are ON by default, which is
# what the bench wants. Set to false for a shipped deployment to take them down entirely —
# with the gate off those paths answer exactly like a route that does not exist, so the
# page cannot be discovered. Omit to keep them enabled. Example:
#   - name: prod1
#     ...
#     docs_enabled: false

instances:
  - name: test1
    # name → container names: emulator-{name}, audio-capture-mgr-{name}
    # name → INSTANCE_SERIAL: emulator-{name}:5555
    serial: "emulator-test1:5555"
    pulse_sink: emu_audio_2
    pulse_source: emu_mic_2
    v4l2_device: /dev/video21
    manager_port: 7601
    adb_port: 5557
    vnc_port: 6081
    webrtc_udp_min: 40020
    webrtc_udp_max: 40030
    op_mcc: "250"
    op_mnc: "01"
    op_name: MTS
    # op-v6 = op-v5 + the orchid_ril_prop SELinux label, which is what lets the Cell-tower
    # operblock write persist.vendor.orchid.ril.* from the plain shell (no adb root, so the
    # screen stream survives). Required: cell-tower.js no longer takes root.
    # op-shim keeps the MTS operator identity; no wifi/phone/beacons configured here.
    emulator_image: orchid-emulator:op-v6
    cell_geo: true

  - name: test2
    serial: "emulator-test2:5555"
    pulse_sink: emu_audio_3
    pulse_source: emu_mic_3
    v4l2_device: /dev/video22
    manager_port: 7602
    adb_port: 5558
    vnc_port: 6082
    webrtc_udp_min: 40040
    webrtc_udp_max: 40050
    # op-v6 = op-v5 + the orchid_ril_prop SELinux label, which is what lets the Cell-tower
    # operblock write persist.vendor.orchid.ril.* from the plain shell (no adb root, so the
    # screen stream survives). Required: cell-tower.js no longer takes root.
    # Bare instance — no operator/wifi/phone/beacons.
    emulator_image: orchid-emulator:op-v6
    cell_geo: true

  - name: test3
    serial: "emulator-test3:5555"
    pulse_sink: emu_audio_4
    pulse_source: emu_mic_4
    v4l2_device: /dev/video23
    manager_port: 7603
    adb_port: 5559
    vnc_port: 6083
    webrtc_udp_min: 40060
    webrtc_udp_max: 40070
    op_mcc: "250"
    op_mnc: "01"
    op_name: MTS
    # op-v6 = op-v5 (baked RIL + /etc/passwd self-heal + Redmi Note 12 build.prop mask)
    # + the orchid_ril_prop SELinux label. The label is what lets the Cell-tower operblock
    # write persist.vendor.orchid.ril.* from the plain shell: before it, that needed
    # `adb root`, and a root adbd stops minicap, so the operblock and the screen stream
    # could not both work. Required now — cell-tower.js no longer takes root, so on op-v5
    # the operblock would silently do nothing. Pilot for the fleet flip off op-v5.
    emulator_image: orchid-emulator:op-v6
    # Mount opencellid-data/towers.db + CELL_GEO_DB into the manager so "Sync cell
    # towers with location" can look up real LTE towers (op-v5 RIL makes cells settable).
    cell_geo: true
    wifi_ssid: OrchidNet
    wifi_password: "orchidpass"
    phone_number: "79001234567"
    # BT RSSI via netsim (launch arg). Combines with wifi into one -netsim-args.
    bt_rssi: "-65"
    # Fake BLE beacons — injected into netsim after boot (POST /v1/devices).
    ble_beacons:
      - name: OrchidBeacon
        mac: "be:ac:0b:0c:0d:0e"
        manufacturer_data: "00ff01020304"
        service_uuid: "0000fe2c-0000-1000-8000-00805f9b34fb"
        service_data: "aabbcc"
        tx_power: high
        interval: low-latency
      - name: CoffeeShopBeacon
        manufacturer_data: "4c000215"
        tx_power: medium
    # Per-instance identity. serialno -> ro.serialno via bootconfig (launch).
    # wifi_mac -> wlan0 MAC, applied by the manager after boot (needs wifi_ssid).
    serialno: "ORCHIDTEST3A1"
    wifi_mac: "02:00:17:03:00:03"
    # Initial GPS location applied after boot (Moscow, Red Square) so the device
    # doesn't show the emulator's Googleplex default. Starting value only — the user
    # can set their own location in the UI on top.
    initial_lat: 55.751244
    initial_lon: 37.618423
