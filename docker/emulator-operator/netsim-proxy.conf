
[program:netsim_proxy]
; Expose netsimd's localhost-only frontend (127.0.0.1:7681) on 0.0.0.0:7682 so
; the capture-manager (a separate container) can add/remove BLE beacons at
; runtime via emulator-<instance>:7682. socat forwards per-connection, so it
; survives netsimd restarts; supervisord keeps socat itself alive.
command=/usr/bin/socat TCP-LISTEN:7682,fork,reuseaddr TCP:127.0.0.1:7681
autostart=true
autorestart=true
startretries=1000
startsecs=3
stdout_logfile=%(ENV_LOG_PATH)s/netsim_proxy.stdout.log
redirect_stderr=true
priority=3
